<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Драфт отпуска</title>
<style>
:root{--bg:#fff7ea;--ink:#172033;--muted:#6f7480;--card:#fff;--line:#eadfce;--accent:#ff6b35;--accent2:#5b5ce2;--green:#23a26d;--yellow:#f6b73c;--red:#e65353;--shadow:0 12px 30px rgba(44,35,22,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
body{overflow-x:hidden}.app{min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.pill{font-size:12px;font-weight:900;background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px}
.hero{padding:30px 0 18px}.kicker{text-transform:uppercase;letter-spacing:1.8px;font-weight:900;font-size:12px;color:var(--accent)}h1{font-size:46px;line-height:.94;margin:8px 0 16px;letter-spacing:-2.4px}h2{font-size:30px;line-height:1;margin:6px 0 12px;letter-spacing:-1px}h3{margin:0 0 6px}.lead{font-size:17px;line-height:1.45;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid var(--line);background:#fff;border-radius:20px;padding:16px;text-align:left;min-height:126px;cursor:pointer;font:inherit;color:inherit}.choice.selected{border-color:var(--accent);background:#fff1e9;transform:translateY(-1px)}.emoji{font-size:34px;display:block;margin-bottom:8px}.choice b{font-size:16px}.small{font-size:13px;color:var(--muted);line-height:1.35}.btn{border:0;border-radius:18px;padding:15px 18px;background:var(--ink);color:#fff;font:900 16px Nunito;cursor:pointer;width:100%;box-shadow:0 8px 18px rgba(23,32,51,.15)}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.orange{background:var(--accent)}.btn:disabled{opacity:.4}.row{display:flex;gap:10px}.row>*{flex:1}.input{width:100%;padding:16px;border:2px solid var(--line);border-radius:17px;font:800 17px Nunito;outline:none;background:#fff}.input:focus{border-color:var(--accent2)}.avatar{width:110px;height:110px;border-radius:32px;background:linear-gradient(135deg,#ffd9b8,#ffe9d7);display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:14px;border:4px solid #fff;box-shadow:var(--shadow);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:contain;display:block}.player-bar{display:flex;align-items:center;justify-content:flex-end;gap:9px}.player-avatar{width:48px;height:58px;object-fit:contain;object-position:center bottom;display:block;filter:drop-shadow(0 5px 6px rgba(44,35,22,.12))}.player-chip{display:flex;align-items:center;gap:7px;padding:6px 9px 6px 7px;border:1px solid var(--line);background:#fff;border-radius:16px;box-shadow:0 5px 14px rgba(44,35,22,.07);font-size:12px;font-weight:900}.person.clickable{cursor:pointer}.person.clickable:active{transform:scale(.99);background:#fff8ef}.mini img{width:100%;height:100%;object-fit:contain}.mini{overflow:hidden}.profile-person{display:flex;align-items:center;gap:14px}.profile-person .big-person{width:90px;height:110px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 7px 8px rgba(44,35,22,.12))}.backline{display:flex;align-items:center;justify-content:space-between;gap:10px}.click-hint{font-size:11px;color:var(--muted);font-weight:800}.progress{height:9px;background:#eee4d7;border-radius:999px;overflow:hidden;margin:8px 0 20px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb347);border-radius:inherit;transition:.3s}.days{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.day{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:900;background:#fff}.day.on{background:var(--accent);color:#fff;border-color:var(--accent)}.slider{width:100%;accent-color:var(--accent)}
.day-control{margin:12px 0;padding:14px 12px;border:1px solid var(--line);border-radius:18px;background:#fffaf2}
.day-control-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-label{display:flex;align-items:center;gap:10px;min-width:0}
.day-emoji{font-size:27px;line-height:1}
.stepper{display:flex;align-items:center;gap:8px;flex-shrink:0}
.step-btn{width:42px;height:42px;border:0;border-radius:14px;background:#f2eadc;color:var(--ink);font-size:25px;font-weight:900;line-height:1;touch-action:manipulation}
.step-btn:active:not(:disabled){transform:scale(.94);background:#eadcc7}
.step-btn:disabled{opacity:.35}
.step-value{min-width:26px;text-align:center;font-size:20px;font-weight:900}
.days{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.day{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#f0e8da;color:#999;font-size:11px;font-weight:900}
.day.on{background:var(--accent);color:#fff}
.metric-control{margin:12px 0;padding:14px 12px;border:1px solid var(--line);border-radius:18px;background:#fffaf2}
.metric-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.metric-scale{display:flex;align-items:center;gap:8px;margin-top:10px;color:#9a8f80;font-size:11px;font-weight:800}
.scale-dots{display:flex;gap:5px;flex:1;justify-content:center}
.scale-dot{height:7px;flex:1;max-width:42px;border-radius:99px;background:#e6ddce}
.scale-dot.on{background:var(--accent)}.bar{height:13px;background:#eee6db;border-radius:999px;overflow:hidden}.bar i{height:100%;display:block;border-radius:inherit;background:var(--accent)}.result{display:flex;align-items:center;gap:12px}.rank{font-size:30px;font-weight:900;width:44px;text-align:center}.country{font-size:18px;font-weight:900}.score{margin-left:auto;font-size:22px;font-weight:900;color:var(--accent)}.tag{display:inline-flex;gap:5px;align-items:center;padding:7px 9px;border-radius:999px;background:#f6efe5;margin:4px 4px 0 0;font-size:12px;font-weight:900}.warn{background:#fff1f1;color:#a83d3d;border-color:#ffd4d4}.ok{background:#effbf5;color:#18734d;border-color:#ccefdc}.center{text-align:center}.spacer{height:18px}.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#172033;color:#fff;border-radius:16px;padding:13px 15px;font-weight:800;display:none;z-index:10}.muted{color:var(--muted)}.list{display:grid;gap:10px}.person{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fff}.mini{width:48px;height:48px;border-radius:15px;background:#f1e8dc;display:grid;place-items:center;font-size:25px}.note{font-size:12px;color:var(--muted);margin-top:8px}.hide{display:none!important}@media(max-width:420px){h1{font-size:40px}.grid{grid-template-columns:1fr}.choice{min-height:105px}}
</style>

    comfort:Number.isFinite(a.comfort)?a.comfort:3,
    pace:Number.isFinite(a.pace)?a.pace:3,
    history:Number.isFinite(a.history)?a.history:3,
    month:a.month||4,
    updated_at:row.updated_at,
    individual_result:row.individual_result||[]
  };
}
async function syncGroup(){
  try{
    const {data,error}=await db.from("results")
      .select("participant_name,is_guest,answers,individual_result,created_at,updated_at")
      .eq("is_guest",false);
    if(error) throw error;
    groupCache=(data||[]).map(rowToPerson).filter(x=>x.name);
    localStorage.setItem("vacationDraftGroup",JSON.stringify(groupCache));
    if(["results","personResult"].includes(state.screen)) render();
  }catch(e){
    console.warn("Supabase sync error",e);
    if(!groupCache.length) groupCache=[];
    if(state.screen==="results") toast("Не удалось обновить групповые данные");
  }
}
function participantPayload(){
  return {
    participant_name:state.person,
    is_guest:false,
    answers:{
      days:state.days,
      flags:state.flags,
      nightlife:state.nightlife,
      comfort:state.comfort,
      pace:state.pace,
      history:state.history,
      month:state.month
    },
    individual_result:state.individual,
    updated_at:new Date().toISOString()
  };
}
async function saveParticipantRemote(){
  const payload=participantPayload();
  const {data,error}=await db.from("results")
    .upsert(payload,{onConflict:"participant_name"})
    .select("participant_name,is_guest,answers,individual_result,created_at,updated_at")
    .single();
  if(error) throw error;
  const saved=rowToPerson(data);
  groupCache=groupCache.filter(x=>x.name!==saved.name);
  groupCache.push(saved);
  groupCache.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  localStorage.setItem("vacationDraftGroup",JSON.stringify(groupCache));
}
function toast(t){let el=document.getElementById("toast");el.textContent=t;el.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display="none",2200)}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function personInitials(name){return name.split(" ").map(x=>x[0]).slice(0,2).join("")}
function avatarHTML(name,cls="avatar-img"){const src=AVATARS[name];return src?`<img class="${cls}" src="${src}" alt="${esc(name)}">`:`<span>${personInitials(name)}</span>`}
function playerBar(){const name=state.person||"Гость";return `<div class="player-bar"><div class="player-chip">${avatarHTML(name,"player-avatar")}<span>${esc(name)}</span></div></div>`}
function profileFromSaved(p){return {...state,...p,mode:p.mode||"participant"};}
function calcForPerson(p){const original=state;state=profileFromSaved(p);const r=calc();state=original;return r;}
function render(){let a=document.getElementById("app");a.innerHTML=screenHTML();bind();save()}
function screenHTML(){
 if(state.screen==="home") return `<div class="top"><div class="logo">✈️ ДРАФТ ОТПУСКА</div><div class="pill">12 дней · ₽220К</div></div>
 <div class="hero"><div class="kicker">Vacation Draft</div><h1>Куда едем<br>всем составом?</h1><p class="lead">Небольшая игра, которая соберёт ваши желания и превратит их в общий маршрут.</p></div>
 <div class="card"><button class="btn orange" onclick="startParticipant()">Я участник</button><div class="spacer"></div><button class="btn alt" onclick="startGuest()">Я гость</button><div class="spacer"></div><button class="btn alt" onclick="showResults()">Посмотреть результаты группы</button></div>
 <div class="card"><b>Как это работает</b><p class="small">3 раунда → личный профиль → общий драфт. Гость получает свой результат, но не влияет на группу.</p></div>`;
 if(state.screen==="identify") return `<div class="top"><button class="pill" onclick="go('home')">← Назад</button><div class="pill">Участник</div></div>
 <div class="hero"><div class="kicker">Шаг 1</div><h2>Кто ты?</h2><p class="lead">Введи точные Фамилию и Имя. Регистр и лишние пробелы не важны.</p></div>
 <div class="card"><input id="name" class="input" autocomplete="name" placeholder="Фамилия Имя"><div class="spacer"></div><button class="btn orange" onclick="identify()">Найти персонажа</button></div>`;
 if(state.screen==="confirm") return `<div class="top"><button class="pill" onclick="go('identify')">← Назад</button><div class="pill">Готов?</div></div>
 <div class="hero"><div class="kicker">Персонаж найден</div><h2>${esc(state.person)}</h2><p class="lead">Этот персонаж будет представлять тебя в Драфте.</p></div>
 <div class="card center"><div class="avatar">${avatarHTML(state.person)}</div><h3>${esc(state.person)}</h3><p class="small">Данные попадут в общий результат группы.</p><button class="btn orange" onclick="beginGame()">Погнали</button></div>`;
 if(state.screen==="game") return gameHTML();
 if(state.screen==="result") return resultHTML();
 if(state.screen==="personResult") return personResultHTML();
 if(state.screen==="results") return resultsHTML();
}
function gameHTML(){
 let s=state.step;
 if(s===0) return `<div class="top"><div class="pill">Раунд 1 / 3</div>${playerBar()}</div>
 <div class="hero"><div class="kicker">Твой отпуск</div><h2>Разложи 10 дней</h2><p class="lead">Сколько времени ты бы отдал каждому типу отдыха?</p></div>
 <div class="card">${dayControl("beach","🏖️","Пляж")} ${dayControl("city","🏙️","Города")} ${dayControl("nature","🌿","Природа / активный отдых")}
 <div class="days">${Array.from({length:10},(_,i)=>`<span class="day ${i<state.days.beach?'on':''}">${i+1}</span>`).join("")}</div>
 <p class="small">Итого: <b>${state.days.beach+state.days.city+state.days.nature}/10</b></p>
 <button class="btn orange" ${sumDays()===10?'':'disabled'} onclick="nextRound()">Продолжить</button></div>`;
 if(s===1) return `<div class="top"><div class="pill">Раунд 2 / 3</div>${playerBar()}</div>
 <div class="hero"><div class="kicker">Твой стиль</div><h2>Что для тебя важно?</h2><p class="lead">Выбери уровень кнопками. Не думай слишком долго.</p></div>
 <div class="card">${slider("nightlife","🍻","Ночная жизнь","Нужны бары, клубы, движ.",1,5)}
 ${slider("comfort","🛏️","Комфорт","Нормальное жильё и минимум бытового экстрима.",1,5)}
 ${slider("pace","🏃","Темп","Хочу много увидеть и делать.",1,5)}
 ${slider("history","🏛️","История","Архитектура, древние места, музеи.",1,5)}
 <button class="btn orange" onclick="nextRound()">Дальше</button></div>`;
 return `<div class="top"><div class="pill">Раунд 3 / 3</div>${playerBar()}</div>
 <div class="hero"><div class="kicker">Красные флаги</div><h2>Что точно может убить поездку?</h2><p class="lead">Выбери максимум 5. Если проблема не критична — не бери её.</p></div>
 <div class="list">${REDFLAGS.map((x,i)=>`<button class="choice ${state.flags.includes(x[0])?'selected':''}" onclick="toggleFlag('${x[0]}')"><span class="emoji">${x[1]}</span><b>${x[2]}</b><div class="small">${x[3]}</div></button>`).join("")}</div>
 <div class="spacer"></div><button class="btn orange" onclick="finish()">Показать мой результат</button>`;
}
function dayControl(k,e,n){
  return `<div class="day-control">
    <div class="day-control-main">
      <div class="day-label"><span class="day-emoji">${e}</span><div><b>${n}</b><div class="small">${state.days[k]} ${state.days[k]===1?'день':'дней'}</div></div></div>
      <div class="stepper">
        <button class="step-btn" aria-label="Убавить день" onclick="changeDay('${k}',-1)" ${state.days[k]===0?'disabled':''}>−</button>
        <span class="step-value">${state.days[k]}</span>
        <button class="step-btn" aria-label="Добавить день" onclick="changeDay('${k}',1)" ${sumDays()>=10?'disabled':''}>+</button>
      </div>
    </div>
  </div>`
}
function slider(k,e,n,min,max){
  return `<div class="metric-control">
    <div class="metric-head"><div class="day-label"><span class="day-emoji">${e}</span><div><b>${n}</b><div class="small">${metricHint(k)}</div></div></div>
      <div class="stepper">
        <button class="step-btn" aria-label="Убавить" onclick="changeVal('${k}',-1)" ${state[k]<=min?'disabled':''}>−</button>
        <span class="step-value">${state[k]}</span>
        <button class="step-btn" aria-label="Добавить" onclick="changeVal('${k}',1)" ${state[k]>=max?'disabled':''}>+</button>
      </div>
    </div>
    <div class="metric-scale"><span>низко</span><div class="scale-dots">${Array.from({length:max-min+1},(_,i)=>`<span class="scale-dot ${i+min<=state[k]?'on':''}"></span>`).join("")}</div><span>высоко</span></div>
  </div>`
}
function metricHint(k){
  return ({nightlife:"Бары, клубы, вечерний движ.",comfort:"Нормальное жильё и минимум бытового экстрима.",pace:"Хочу много увидеть и делать.",history:"Архитектура, древние места, музеи."})[k]||"Выбери комфортный для тебя уровень.";
}
function changeVal(k,delta){
  const next=state[k]+delta;
  if(next<1 || next>5) return;
  state[k]=next;
  render();
}
function resultHTML(){let r=state.individual;return `<div class="top"><div class="pill">Твой результат</div><div class="pill">${state.mode==="guest"?"Гость":"Участник"}</div></div>
<div class="hero"><div class="kicker">Travel DNA</div><h2>${state.mode==="guest"?"Твой":"Ваш"} профиль готов</h2><p class="lead">Вот какие направления лучше всего совпали с твоими ответами.</p></div>
<div class="card">${r.slice(0,5).map((x,i)=>`<div class="result"><div class="rank">${i+1}</div><div><div class="country">${x.e} ${x.n}</div><div class="small">${x.reason}</div></div><div class="score">${x.score}</div></div><div class="bar" style="margin:8px 0 14px"><i style="width:${x.score}%"></i></div>`).join("")}</div>
<div class="card"><b>Твой профиль</b><div>${profileTags()}</div></div>
<div class="card"><b>Red Flags</b><div>${state.flags.length?state.flags.map(f=>{let x=REDFLAGS.find(z=>z[0]===f);return `<span class="tag warn">${x[1]} ${x[2]}</span>`}).join(""):"<span class='small'>Не выбраны</span>"}</div></div>
<button class="btn orange" onclick="showResults()">Смотреть Драфт группы</button><div class="spacer"></div><button class="btn alt" onclick="go('home')">На главную</button>`;
}
function personResultHTML(){
 const people=groupCache;
 const p=people.find(x=>x.name===state.viewingPerson);
 if(!p){return `<div class="card"><b>Результат не найден</b><button class="btn orange" onclick="showResults()">Назад к группе</button></div>`}
 const r=calcForPerson(p);
 return `<div class="top"><button class="pill" onclick="showResults()">← К группе</button><div class="pill">Личный результат</div></div>
 <div class="hero"><div class="kicker">Личный профиль</div><div class="profile-person">${avatarHTML(p.name,"big-person")}<div><h2 style="margin:0">${esc(p.name)}</h2><p class="lead" style="margin:7px 0 0">Результат этого участника отдельно от общего драфта.</p></div></div></div>
 <div class="card">${r.slice(0,5).map((x,i)=>`<div class="result"><div class="rank">${i+1}</div><div><div class="country">${x.e} ${x.n}</div><div class="small">${x.reason}</div></div><div class="score">${x.score}</div></div><div class="bar" style="margin:8px 0 14px"><i style="width:${x.score}%"></i></div>`).join("")}</div>
 <div class="card"><b>Профиль</b><div>${profileTagsFor(p)}</div></div>
 <div class="card"><b>Red Flags</b><div>${p.flags.length?p.flags.map(f=>{let x=REDFLAGS.find(z=>z[0]===f);return `<span class="tag warn">${x[1]} ${x[2]}</span>`}).join(""):"<span class='small'>Не выбраны</span>"}</div></div>`;
}
function profileTagsFor(p){let arr=[["🏖️","Пляж",p.days.beach],["🏙️","Города",p.days.city],["🌿","Природа",p.days.nature],["🍻","Ночная жизнь",p.nightlife],["🛏️","Комфорт",p.comfort],["🏃","Темп",p.pace],["🏛️","История",p.history]];return arr.map(x=>`<span class="tag">${x[0]} ${x[1]} ${x[2]}${x[1].includes("Пляж")||x[1].includes("Города")||x[1].includes("Природа")?"/10":"/5"}</span>`).join("")}
function profileTags(){let arr=[["🏖️","Пляж",state.days.beach],["🏙️","Города",state.days.city],["🌿","Природа",state.days.nature],["🍻","Ночная жизнь",state.nightlife],["🛏️","Комфорт",state.comfort],["🏃","Темп",state.pace],["🏛️","История",state.history]];return arr.map(x=>`<span class="tag">${x[0]} ${x[1]} ${x[2]}${x[1].includes("Пляж")||x[1].includes("Города")||x[1].includes("Природа")?"/10":"/5"}</span>`).join("")}
function resultsHTML(){let people=groupCache;let all=people.filter(x=>x.mode==="participant");let agg=aggregate(all);return `<div class="top"><button class="pill" onclick="go('home')">← Главная</button><div class="pill">${all.length}/9</div></div>
<div class="hero"><div class="kicker">Общий драфт</div><h2>Куда едет компания?</h2><p class="lead">${all.length?`Уже прошли игру ${all.length} из 9 участников.`:"Пока никто из участников не прошёл игру."}</p></div>
<div class="card">${agg.slice(0,7).map((x,i)=>`<div class="result"><div class="rank">${i+1}</div><div><div class="country">${x.e} ${x.n}</div><div class="small">${x.reason}</div></div><div class="score">${x.score}</div></div><div class="bar" style="margin:8px 0 14px"><i style="width:${x.score}%"></i></div>`).join("")}</div>
<div class="card"><div class="backline"><b>Кто уже прошёл</b><span class="click-hint">Нажми на аватар → личный результат</span></div><div class="list" style="margin-top:10px">${all.length?all.map(p=>`<div class="person clickable" onclick="openPerson('${esc(p.name)}')"><div class="mini">${avatarHTML(p.name,"mini-avatar")}</div><div><b>${esc(p.name)}</b><div class="small">Опрос пройден · открыть личный результат</div></div></div>`).join(""):"<div class='small'>Список появится после первого прохождения.</div>"}</div></div>
<div class="card"><b>Важные ограничения группы</b><div>${aggregateFlags(all).map(x=>`<span class="tag ${x.n>=Math.ceil(Math.max(1,all.length)*.5)?"warn":""}">${x.e} ${x.label} · ${x.n}/${all.length}</span>`).join("")||"<span class='small'>Пока недостаточно данных.</span>"}</div></div>
<button class="btn orange" onclick="startGuest()">Пройти как гость</button>`;
}
function sumDays(){return state.days.beach+state.days.city+state.days.nature}
function setDay(k,v){v=+v;let others=sumDays()-state.days[k];if(others+v>10)return;state.days[k]=v;render()}
function changeDay(k,delta){
  const total=sumDays();
  const next=state.days[k]+delta;
  if(next<0) return;
  if(delta>0 && total>=10) return;
  state.days[k]=next;
  render();
}
function setVal(k,v){state[k]=+v;render()}
function toggleFlag(k){if(state.flags.includes(k))state.flags=state.flags.filter(x=>x!==k);else if(state.flags.length<5)state.flags.push(k);else toast("Максимум 5 Red Flags");render()}
function startParticipant(){state.mode="participant";state.screen="identify";render()}
function startGuest(){state.mode="guest";state.person="Гость";state.screen="game";state.step=0;state.days={beach:3,city:3,nature:4};state.flags=[];state.month=4;state.nightlife=3;state.comfort=3;state.pace=3;state.history=3;render()}
function normalizeName(v){
  return (v||"").normalize("NFC").trim().replace(/\\s+/g," ").toLowerCase().replace(/ё/g,"е");
}
function identify(){
  const v=normalizeName(document.getElementById("name").value);
  const p=PEOPLE.find(x=>normalizeName(x[0])===v);
  if(!p){toast("Такого участника нет в списке. Введи Фамилию Имя.");return}
  state.person=p[0];state.screen="confirm";render();
}
function beginGame(){state.step=0;state.days={beach:3,city:3,nature:4};state.flags=[];state.nightlife=3;state.comfort=3;state.pace=3;state.history=3;state.screen="game";render()}
function nextRound(){if(state.step===0&&sumDays()!==10){toast("Нужно распределить ровно 10 дней");return}state.step++;render()}
function scoreCountry(c){
 let mix=[state.days.beach/10,state.days.city/10,state.days.nature/10];
 let fit=100*(mix[0]*c.mix[0]+mix[1]*c.mix[1]+mix[2]*c.mix[2]);
 fit+=((state.nightlife-1)/4)*(c.tags.includes("ночная жизнь")?8:0);
 fit+=((state.history-1)/4)*(c.tags.includes("история")?7:0);
 fit+=((state.comfort-1)/4)*(c.n.includes("Мальдивы")?4:0);
 fit+=((state.pace-1)/4)*(c.mix[2]*5);
 let monthScore=c.months[state.month-3]||.7;fit*=.72+.28*monthScore;
 let penalty=0;
 state.flags.forEach(f=>{
  if(f==="night"&&!c.tags.includes("ночная жизнь"))penalty+=13;
  if(f==="history"&&!c.tags.includes("история"))penalty+=13;
  if(f==="budget"&&c.budget>220)penalty+=20;
  if(f==="moves"&&["Филиппины","Япония","Индия","Китай"].includes(c.n))penalty+=5;
  if(f==="heat"&&["Египет","Таиланд","Индия","Вьетнам"].includes(c.n))penalty+=8;
 });
 let score=Math.max(0,Math.min(99,Math.round(fit-penalty)));
 let reason=c.tags.slice(0,3).map(x=>x).join(" · ");
 return {...c,score,reason};
}
function calc(){return COUNTRIES.map(scoreCountry).sort((a,b)=>b.score-a.score)}
async function finish(){
  state.individual=calc();
  if(state.mode==="participant"){
    const local={
      name:state.person,mode:"participant",days:state.days,flags:state.flags,
      nightlife:state.nightlife,comfort:state.comfort,pace:state.pace,
      history:state.history,month:state.month,individual_result:state.individual,
      updated_at:new Date().toISOString()
    };
    groupCache=groupCache.filter(x=>x.name!==state.person);
    groupCache.push(local);
    localStorage.setItem("vacationDraftGroup",JSON.stringify(groupCache));
    try{
      await saveParticipantRemote();
    }catch(e){
      console.error("Supabase save error",e);
      toast("Не удалось сохранить общий результат. Проверь интернет.");
    }
  }
  state.screen="result";
  render();
}
function aggregate(all){if(!all.length)return COUNTRIES.map(c=>({...c,score:0,reason:"Ждём участников"}));let original=state;let out=COUNTRIES.map(c=>{let vals=all.map(p=>{state={...original,...p};return scoreCountry(c).score});return {...c,score:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),reason:`Среднее совпадение для ${vals.length} участников`}}).sort((a,b)=>b.score-a.score);state=original;return out}
function aggregateFlags(all){let m={};all.forEach(p=>p.flags.forEach(f=>m[f]=(m[f]||0)+1));return REDFLAGS.map(x=>({e:x[1],label:x[2],n:m[x[0]]||0})).filter(x=>x.n).sort((a,b)=>b.n-a.n)}
function openPerson(name){state.viewingPerson=name;state.screen="personResult";render()}
function showResults(){state.screen="results";render()}
function go(s){state.screen=s;render()}
function bind(){}
load();
render();
syncGroup();
</script>
