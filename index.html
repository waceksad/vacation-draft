function setNumber(k,v){let n=Math.round(+v||0);if(k==="daysMin")n=Math.max(1,Math.min(30,n));if(k==="daysMax")n=Math.max(1,Math.min(30,n));if(k==="budget")n=Math.max(50000,Math.min(1000000,n));state[k]=n;render()}

function monthList(a,b){const lo=Math.min(a,b),hi=Math.max(a,b);return Array.from({length:hi-lo+1},(_,i)=>lo+i)}
function monthFit(country,p){return monthList(p.startMonth,p.endMonth).reduce((s,m)=>s+country.season[m-1],0)/monthList(p.startMonth,p.endMonth).length}
function normalizePerson(p){
 const d=p.days||{beach:3,city:3,nature:4};
 const start=Number.isFinite(p.startMonth)?p.startMonth:(Number.isFinite(p.month)?Math.max(1,Math.min(12,p.month)):4);
 const end=Number.isFinite(p.endMonth)?p.endMonth:start;
 return {...p,days:{beach:+d.beach||0,city:+d.city||0,nature:+d.nature||0},daysMin:+p.daysMin||10,daysMax:+p.daysMax||12,budget:+p.budget||220000,startMonth:start,endMonth:Math.max(start,end),nightlife:+p.nightlife||3,comfort:+p.comfort||3,pace:+p.pace||3,history:+p.history||3,flags:Array.isArray(p.flags)?p.flags:[]};
}
function countryScore(c,p){
 p=normalizePerson(p);
 const style=(p.days.beach/10*c.mix[0]+p.days.city/10*c.mix[1]+p.days.nature/10*c.mix[2]);
 const styleScore=style*56;
 let pref=0;
 if(c.tags.includes("ночная жизнь"))pref+=(p.nightlife-1)/4*9; else pref+=(5-p.nightlife)/4*2;
 if(c.tags.includes("история"))pref+=(p.history-1)/4*9;
 if(c.n.includes("Мальдивы"))pref+=(p.comfort-1)/4*3;
 pref+=(p.pace-1)/4*(c.mix[1]*2+c.mix[2]*4);
 const mf=monthFit(c,p);
 const monthScore=mf*10;
 const dailyBudget=p.budget/Math.max(1,(p.daysMin+p.daysMax)/2);
 const budgetRatio=dailyBudget/c.daily;
 const budgetScore=Math.max(0,Math.min(10,8+(budgetRatio-1)*10));
 const idealOverlap=Math.max(0,Math.min(p.daysMax,c.ideal[1])-Math.max(p.daysMin,c.ideal[0])+1);
 const span=Math.max(1,p.daysMax-p.daysMin+1);
 const durationScore=(idealOverlap/span)*7;
 let penalty=0;
 p.flags.forEach(f=>{
   if(f==="moves") penalty+=c.n==="Китай"||c.n==="Япония"||c.n==="Индия"?5:1;
   if(f==="night"&&!c.tags.includes("ночная жизнь"))penalty+=7;
   if(f==="history"&&!c.tags.includes("история"))penalty+=7;
   if(f==="heat"&&["Египет","Таиланд","Индия","Вьетнам"].includes(c.n))penalty+=6;
   if(f==="crowd"&&["Таиланд","Испания","Италия","Япония"].includes(c.n))penalty+=4;
 });
 return Math.max(0,Math.min(100,styleScore+pref+monthScore+budgetScore+durationScore-penalty));
}
function calcFor(p){return COUNTRIES.map(c=>({...c,score:countryScore(c,p)})).sort((a,b)=>b.score-a.score)}
function aggregate(all){
 if(!all.length)return [];
 const ps=all.map(normalizePerson);
 return COUNTRIES.map(c=>{
   const vals=ps.map(p=>countryScore(c,p));
   const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
   const spread=Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length);
   const consensus=Math.max(0,10-spread);
   return {...c,score:mean+consensus*.15,mean,spread};
 }).sort((a,b)=>b.score-a.score);
}
function aggregateFlags(all){
 const m={};all.forEach(p=>(p.flags||[]).forEach(f=>m[f]=(m[f]||0)+1));
 return REDFLAGS.map(x=>({...x,count:m[x[0]]||0})).filter(x=>x.count).sort((a,b)=>b.count-a.count);
}
function groupProfile(all){
 if(!all.length)return {beach:.3,city:.3,nature:.4,nightlife:3,history:3,budget:220000,daysMin:10,daysMax:12,startMonth:4,endMonth:6};
 const ps=all.map(normalizePerson), n=ps.length;
 return {
 beach:ps.reduce((s,p)=>s+p.days.beach/10,0)/n,city:ps.reduce((s,p)=>s+p.days.city/10,0)/n,nature:ps.reduce((s,p)=>s+p.days.nature/10,0)/n,
 nightlife:ps.reduce((s,p)=>s+p.nightlife,0)/n,history:ps.reduce((s,p)=>s+p.history,0)/n,
 budget:ps.reduce((s,p)=>s+p.budget,0)/n,daysMin:Math.round(ps.reduce((s,p)=>s+p.daysMin,0)/n),daysMax:Math.round(ps.reduce((s,p)=>s+p.daysMax,0)/n),
 startMonth:Math.min(...ps.map(p=>p.startMonth)),endMonth:Math.max(...ps.map(p=>p.endMonth))
 };
}
function routeFor(country,all){
 const candidates=ROUTES[country.n]||[];
 if(!candidates.length)return [];
 const g=groupProfile(all);
 const shares={city:g.city,beach:g.beach,nature:g.nature,history:Math.max(g.history/5*.7,g.city*.35)};
 const desiredDays=Math.max(5,Math.min(18,Math.round((g.daysMin+g.daysMax)/2)));
 const count=desiredDays<=7?3:desiredDays<=11?4:5;
 const dominant=Object.entries({city:g.city,beach:g.beach,nature:g.nature}).sort((a,b)=>b[1]-a[1])[0][0];
 let allowed;
 if(shares[dominant]>=.50){
   if(dominant==='city') allowed=new Set(['city','history']);
   else if(dominant==='beach') allowed=new Set(['beach']);
   else allowed=new Set(['nature','history']);
 }else allowed=new Set(['city','history','nature','beach']);
 let pool=candidates.filter(x=>allowed.has(x[1])).map(x=>({...x,weight:(shares[x[1]]||.1)+(x[1]==='history'?g.history/5*.18:0)+(x[2].includes('ночная')&&g.nightlife>=4?.12:0)}));
 if(pool.length<count){const extra=candidates.filter(x=>!pool.includes(x));pool.push(...extra.map(x=>({...x,weight:(shares[x[1]]||.05)*.45})));}
 pool.sort((a,b)=>b.weight-a.weight);
 const selected=[];
 for(const x of pool){if(selected.length>=count)break;if(selected.length<2||x.weight>=.25)selected.push(x)}
 if(selected.length<count)for(const x of pool)if(!selected.includes(x))selected.push(x);
 const base=Math.floor(desiredDays/selected.length), rem=desiredDays%selected.length;
 return selected.slice(0,count).map((x,i)=>({name:x[0],type:x[1],meta:x[2],lat:x[3],lng:x[4],days:base+(i<rem?1:0)}));
}
function reasonFor(c,g){
 const parts=[];
 const max=Math.max(g.beach,g.city,g.nature);
 if(max===g.city&&c.mix[1]>.75)parts.push("много городов");
 if(max===g.beach&&c.mix[0]>.8)parts.push("сильный пляжный профиль");
 if(max===g.nature&&c.mix[2]>.8)parts.push("природа");
 if(g.history>=4&&c.tags.includes("история"))parts.push("история");
 if(g.nightlife>=4&&c.tags.includes("ночная жизнь"))parts.push("ночная жизнь");
 return parts.slice(0,3).join(" · ")||c.tags.slice(0,3).join(" · ");
}

function participantPayload(){
 return {participant_name:state.person,is_guest:false,answers:{
   days:state.days,daysMin:state.daysMin,daysMax:state.daysMax,budget:state.budget,startMonth:state.startMonth,endMonth:state.endMonth,
   flags:state.flags,nightlife:state.nightlife,comfort:state.comfort,pace:state.pace,history:state.history
 },individual_result:state.individual,updated_at:new Date().toISOString()};
}
async function saveParticipant(){
 const {data,error}=await db.from("results").upsert(participantPayload(),{onConflict:"participant_name"}).select("participant_name,is_guest,answers,individual_result,updated_at").single();
 if(error)throw error;
 const p=rowToPerson(data);groupCache=groupCache.filter(x=>x.name!==p.name);groupCache.push(p);groupCache.sort((a,b)=>a.name.localeCompare(b.name,"ru"));save();
}
function rowToPerson(row){const a=row.answers||{};return normalizePerson({name:row.participant_name,mode:"participant",days:a.days,daysMin:a.daysMin,daysMax:a.daysMax,budget:a.budget,startMonth:a.startMonth,endMonth:a.endMonth,month:a.month,flags:a.flags,nightlife:a.nightlife,comfort:a.comfort,pace:a.pace,history:a.history,individual_result:row.individual_result||[],updated_at:row.updated_at})}
async function syncGroup(){
 try{const {data,error}=await db.from("results").select("participant_name,is_guest,answers,individual_result,updated_at").eq("is_guest",false);if(error)throw error;groupCache=(data||[]).map(rowToPerson).filter(x=>x.name);save();if(state.screen==="results")render()}catch(e){console.warn(e)}
}
function finish(){
 state.individual=calcFor(state);
 if(state.mode==="participant"){
   const local={name:state.person,mode:"participant",days:state.days,daysMin:state.daysMin,daysMax:state.daysMax,budget:state.budget,startMonth:state.startMonth,endMonth:state.endMonth,flags:state.flags,nightlife:state.nightlife,comfort:state.comfort,pace:state.pace,history:state.history,individual_result:state.individual,updated_at:new Date().toISOString()};
   groupCache=groupCache.filter(x=>x.name!==state.person);groupCache.push(local);save();
   saveParticipant().catch(e=>{console.error(e);toast("Не удалось сохранить результат в группу")});
 }
 state.screen="result";render();
}

function metric(k,icon,label,desc){return `<div class="metric"><div class="metric-head"><div class="metric-name"><span class="metric-icon">${icon}</span><div><b>${label}</b><div class="small">${desc}</div></div></div><div class="stepper"><button class="step" onclick="changeMetric('${k}',-1)">−</button><span class="value">${state[k]}</span><button class="step" onclick="changeMetric('${k}',1)">+</button></div></div><div class="dots">${[1,2,3,4,5].map(i=>`<i class="dot ${i<=state[k]?'on':''}"></i>`).join("")}</div></div>`}
function dayControl(k,icon,label){return `<div class="stepper-card"><div class="stepper-head"><div><b>${icon} ${label}</b><div class="small">${state.days[k]} ${state.days[k]===1?"день":"дней"}</div></div><div class="stepper"><button class="step" onclick="changeDay('${k}',-1)">−</button><span class="value">${state.days[k]}</span><button class="step" onclick="changeDay('${k}',1)">+</button></div></div></div>`}

 if(state.step===1)return `<div class="round-screen">${roundTop(2)}<div class="hero"><div class="kicker">Раунд 2</div><h2>Логистика</h2><p class="lead">Задай бюджет, длительность и желаемый период старта в 2027 году.</p></div><div class="card"><b>Длительность</b><div class="range-row"><div><div class="small">от</div><input class="input" type="number" min="1" max="30" value="${state.daysMin}" oninput="setNumber('daysMin',this.value)"></div><div><div class="small">до</div><input class="input" type="number" min="1" max="30" value="${state.daysMax}" oninput="setNumber('daysMax',this.value)"></div></div><div class="spacer"></div><b>Бюджет на человека</b><input class="input" style="margin-top:8px" type="number" step="5000" value="${state.budget}" oninput="setNumber('budget',this.value)"><div class="spacer"></div><b>Желаемый старт</b><div class="range-row" style="margin-top:8px"><select class="input" onchange="setMonth('startMonth',this.value)">${MONTHS.map((m,i)=>`<option value="${i+1}" ${state.startMonth===i+1?"selected":""}>${m}</option>`).join("")}</select><select class="input" onchange="setMonth('endMonth',this.value)">${MONTHS.map((m,i)=>`<option value="${i+1}" ${state.endMonth===i+1?"selected":""}>${m}</option>`).join("")}</select></div><div class="small" style="margin-top:8px">От ${MONTHS[state.startMonth-1]} до ${MONTHS[state.endMonth-1]} 2027.</div><button class="btn orange" style="margin-top:18px" onclick="nextRound()">Дальше</button></div></div>`;
 return `<div class="round-screen">${roundTop(3)}<div class="hero"><div class="kicker">Раунд 3</div><h2>Предпочтения</h2><p class="lead">Эти параметры влияют на рейтинг стран и состав маршрута.</p></div><div class="card">${metric("nightlife","🍻","Ночная жизнь","Бары, клубы и вечерняя активность.")}${metric("comfort","🛏️","Комфорт","Жильё и бытовой уровень.")}${metric("pace","🏃","Темп","Сколько активностей хочется успеть.")}${metric("history","🏛️","История","Архитектура, музеи и исторические места.")}</div><div class="hero compact"><div class="kicker">Red flags</div><h2>Что точно не подходит?</h2></div><div class="card">${REDFLAGS.map(x=>`<button class="choice ${state.flags.includes(x[0])?"selected":""}" onclick="toggleFlag('${x[0]}')"><span class="emoji">${x[1]}</span><b>${x[2]}</b><div class="small">${x[3]}</div></button>`).join("")}<button class="btn orange" onclick="finish()">Показать мой результат</button></div></div>`;
}

function resultHTML(){

function render(){
 const a=document.getElementById("app");
 if(state.screen==="home")a.innerHTML=`<div class="top"><div class="logo">✈️ ДРАФТ ОТПУСКА</div><div class="pill">2027</div></div><div class="hero"><div class="kicker">Vacation Draft</div><h1>Куда едем<br>всем составом?</h1><p class="lead">Каждый отвечает за себя. Группа получает общий драфт, а гость — только свой личный результат.</p></div><div class="card"><button class="btn orange" onclick="startParticipant()">Выбрать персонажа и пройти</button><div class="spacer"></div><button class="btn alt" onclick="startGuest()">Я гость</button><div class="spacer"></div><button class="btn alt" onclick="showResults()">Смотреть драфт группы</button></div>`;
 else if(state.screen==="character")a.innerHTML=characterHTML();
 else if(state.screen==="game")a.innerHTML=gameHTML();
 else if(state.screen==="result")a.innerHTML=resultHTML();
 else if(state.screen==="results")a.innerHTML=resultsHTML();
 else if(state.screen==="personResult")a.innerHTML=personResultHTML();
 save();bindSwipe();
 if(["result","results","personResult"].includes(state.screen))setTimeout(initMap,0);
}
function initMap(){
 const el=document.getElementById("map");if(!el)return;
 if(mapInstance){try{mapInstance.remove()}catch(e){}mapInstance=null}
 let country,all;
 if(state.screen==="results"){all=groupCache.filter(x=>x.name).map(normalizePerson);country=aggregate(all)[0]}else if(state.screen==="personResult"){const p=groupCache.find(x=>x.name===state.viewingPerson);country=calcFor(p)[0];all=[p]}else{country=(state.individual||calcFor(state))[0];all=[state]}
 if(!country)return;
 const route=routeFor(country,all);if(!route.length)return;
 mapInstance=L.map(el,{scrollWheelZoom:false,zoomControl:true,attributionControl:true});
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:8,attribution:"© OpenStreetMap contributors"}).addTo(mapInstance);
 const latlngs=route.map(x=>[x.lat,x.lng]);
 const under=L.polyline(latlngs,{color:"#ff7442",weight:11,opacity:.18,lineCap:"round",lineJoin:"round"}).addTo(mapInstance);
 const line=L.polyline(latlngs,{color:"#ff7442",weight:5,opacity:.95,dashArray:"9 10",lineCap:"round",lineJoin:"round"}).addTo(mapInstance);
 route.forEach((x,i)=>{const icon=L.divIcon({className:"",html:`<div class="marker">${i+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]});L.marker([x.lat,x.lng],{icon}).addTo(mapInstance).bindPopup(`<b>${x.name}</b><br>${x.days} дн.<br><span style="color:#777">${x.meta}</span>`)});
 mapInstance.fitBounds(line.getBounds(),{padding:[25,25]});
}
async function loadAvatars(){return AVATARS;}
load();render();syncGroup();loadAvatars().then(()=>{if(state.screen==="character"||state.screen==="results"||state.screen==="personResult")render()});
</script>
</body>
